name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

# Read-only token: the jobs only check out and build
permissions:
  contents: read

# A newer push to the same branch or PR cancels the run it replaces
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Pinned toolchain versions below must be bumped together with rust-toolchain.toml.
jobs:
  check:
    name: Check (clippy, test, docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust 1.100.0
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # Pedantic lints are enforced via the [lints.clippy] table in Cargo.toml.
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # Runs `cargo test --locked` with HOME/XDG sandboxed and fails if any test
      # touched the real pwsw config/data dirs or resolved a default path.
      - name: Run tests (sandboxed, verify_tests_safe.sh)
        run: bash scripts/verify_tests_safe.sh --locked
        env:
          PWSW_TMP: ${{ runner.temp }}

      - name: Check without default features
        run: cargo check --no-default-features --locked

      - name: Docs
        run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  # Informational: prints the line/region coverage summary, never fails the build.
  # The CLI smoke tests pass `LLVM_PROFILE_FILE` into their sandbox, so the binary's
  # own runs count too.
  coverage:
    name: Coverage (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust 1.100.0
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Coverage summary
        run: cargo llvm-cov --locked --summary-only

  fmt:
    name: Formatting (nightly rustfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust nightly-2026-11-14
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-11-14
          components: rustfmt

      - name: Check formatting
        run: cargo +nightly-2026-11-14 fmt --check

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit dependencies
        run: cargo audit
