name: Scheduled checks

# Weekly safety net for a project in maintenance mode: catches new RustSec advisories
# against the committed Cargo.lock, and bit-rot (a pinned toolchain or runner image that
# no longer builds the tree), even when nobody has pushed for months.
#
# Scheduled runs use the default branch. GitHub disables `schedule:` triggers after 60
# days without repository activity; re-enable the workflow from the Actions tab (or run
# it once by hand) if that happens.
on:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

# Pinned toolchain version below must be bumped together with rust-toolchain.toml and
# ci.yml.
jobs:
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Exits non-zero (red run, notification e-mail) on any vulnerability advisory.
      # Unmaintained/yanked crates are reported as warnings in the log.
      - name: Audit dependencies
        run: cargo audit

  build:
    name: Build and test (pinned toolchain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust 1.100.0
        uses: dtolnay/rust-toolchain@1.100.0

      # No rust-cache: a cold build is the point, so a vanished crate or a toolchain
      # that no longer installs shows up here rather than being masked by a cache.
      - name: Build
        run: cargo build --locked

      # `cargo test --locked` with HOME/XDG sandboxed, as in ci.yml.
      - name: Run tests (sandboxed, verify_tests_safe.sh)
        run: bash scripts/verify_tests_safe.sh --locked
        env:
          PWSW_TMP: ${{ runner.temp }}
