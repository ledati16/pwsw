[package]
name = "pwsw"
version = "0.7.0"
edition = "2024"
rust-version = "1.100"
description = "PipeWire Switcher - Automatically switch audio sinks based on active windows"
license = "MIT"
repository = "https://github.com/ledati16/pwsw"
keywords = ["wayland", "pipewire", "audio", "window-manager", "audio-routing"]
categories = ["multimedia::audio", "command-line-utilities"]

[features]
default = ["tui"]
tui = ["dep:ratatui", "dep:tui-input", "dep:throbber-widgets-tui", "dep:futures-util", "crossterm/event-stream"]

[dependencies]
# CLI argument parsing
clap = { version = "4", features = ["derive"] }
clap_complete = "4"   # `pwsw completions <shell>`

# Async runtime - minimal features for Unix socket + signals
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time"] }

# Wayland protocol support
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["staging"] }        # ext-foreign-toplevel-list-v1
wayland-protocols-wlr = { version = "0.3", features = ["client"] }      # wlr-foreign-toplevel-management

# Configuration and serialization
toml_edit = { version = "0.25", features = ["serde"] }   # parsing (serde) and comment-preserving saves
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Pattern matching for window rules
regex = "1"

# Error handling with rich context and backtraces
color-eyre = "0.6"

# Desktop notifications
notify-rust = "4"

# systemd notification protocol
sd-notify = "0.5"

# Terminal styling for CLI and TUI output
crossterm = "0.29"

# Structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# XDG config directory
dirs = "7"

# File system watching (config hot-reload, log tailing)
notify = "8"

# Atomic file writes
tempfile = "3"

# Unix UID lookup, file modes, lock files (replaces unmaintained `users` crate - RUSTSEC-2025-0040)
rustix = { version = "1", default-features = false, features = ["fs", "process"] }

# TUI dependencies (optional - enabled by default via "tui" feature)
ratatui = { version = "0.30", optional = true, default-features = false, features = ["crossterm"] }
tui-input = { version = "0.15", optional = true }
throbber-widgets-tui = { version = "0.11", optional = true }
futures-util = { version = "0.3", optional = true }

[profile.release]
lto = "fat"         # Full link-time optimization for maximum performance
codegen-units = 1   # Single compilation unit for better optimization
strip = true        # Remove debug symbols (smaller binary, no runtime cost)
panic = "abort"     # Immediate termination on panic (systemd restarts daemon)

[build-dependencies]
mandown = "1"

[dev-dependencies]
pretty_assertions = "1"
tokio = { version = "1", features = ["test-util"] }   # paused clock for daemon loop and TUI worker tests
rustix = { version = "1", default-features = false, features = ["net"] }   # sockets that never listened (IPC tests)
rstest = "0.28"
test-case = "3"
wayland-server = "0.31"
wayland-protocols = { version = "0.32", features = ["server", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["server", "client"] }

[lints.cargo]
# Flags dependencies no target uses (Rust 1.100+)
unused_dependencies = "warn"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(test)'] }

[lints.clippy]
# Enforce pedantic lints in plain `cargo clippy -D warnings` (CI); allows below override.
pedantic = { level = "warn", priority = -1 }

# The only pedantic lints allowed project-wide (no other `#[allow]`s outside tests):

# Settings structs and the TUI `App`: independent boolean flags, not state machines
struct_excessive_bools = "allow"

# Event loops, TUI screens, input handlers, command dispatch: cohesive logic hard to split
too_many_lines = "allow"
