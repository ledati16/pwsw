# Rust formatting configuration for pwsw
# See: https://rust-lang.github.io/rustfmt/
#
# USAGE: `cargo +nightly-2026-11-14 fmt` (several options below are nightly-only).

edition = "2024"

# Line width
max_width = 100
use_small_heuristics = "Default"

# Imports - group by origin for clear visual separation
imports_granularity = "Module"
group_imports = "StdExternalCrate"
reorder_imports = true
reorder_modules = true

# Formatting choices
use_field_init_shorthand = true
use_try_shorthand = true
format_code_in_doc_comments = true
format_macro_matchers = true
format_strings = false
hex_literal_case = "Lower"

# Comments - don't reflow, preserve author intent
normalize_comments = false
wrap_comments = false

# Consistency
newline_style = "Unix"
overflow_delimited_expr = true
condense_wildcard_suffixes = true
